{% include base_path %}

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ base_path }}/" aria-label="Jingxi Lu, home">
      <span class="site-brand__mark" aria-hidden="true">JL</span>
      <span>Jingxi Lu</span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
